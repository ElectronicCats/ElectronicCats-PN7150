[platformio]
default_envs = native

; Native environment for unit testing on PC
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++11
    -DUNIT_TEST
    -I test/mocks
    -I src
lib_deps =
test_build_src = yes
test_ignore =
    test_embedded/*

; ESP32 environment for hardware testing
[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
test_framework = unity
lib_deps =
test_ignore =
    test_native/*

; Arduino SAMD environment
[env:samd]
platform = atmelsam
board = mkrwifi1010
framework = arduino
test_framework = unity
lib_deps =
test_ignore =
    test_native/*
